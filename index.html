<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Concrete Works" />
    <meta name="theme-color" content="#1e1e1e" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="ระบบจัดการคำขอคอนกรีต" />
    <link rel="stylesheet" href="/fonts/line-seed-sans.css" />
    <title>Concrete Works</title>
  </head>
  <body>
    <script>
      (function () {
        var variant = 'dark'
        var metaColors = {
          dark: '#1e1e1e',
          light: '#f5f9fc',
          green: '#effaf6',
          pink: '#fff5f9',
        }
        try {
          var raw = localStorage.getItem('cw-theme')
          if (raw) {
            var t = JSON.parse(raw)
            if (
              t.variant === 'dark' ||
              t.variant === 'light' ||
              t.variant === 'green' ||
              t.variant === 'pink'
            ) {
              variant = t.variant
            } else if (t.mode === 'dark') variant = 'dark'
            else if (t.mode === 'light') variant = 'pink'
          } else if (localStorage.getItem('pour-theme') === 'light') {
            variant = 'pink'
          }
        } catch (e) {
          /* ignore */
        }
        var root = document.documentElement
        root.dataset.theme = variant
        root.classList.add(variant === 'dark' ? 'dark' : 'light')
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta && metaColors[variant]) meta.setAttribute('content', metaColors[variant])
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
